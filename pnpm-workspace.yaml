allowBuilds:
  # tsx's esbuild takes its binary from an optional dependency; the postinstall only re-checks it.
  esbuild: false
  sharp: true
  unrs-resolver: true
catalog:
  '@stryker-mutator/core': ^10.0.0
  '@stryker-mutator/vitest-runner': ^10.0.0
  '@types/node': ^26.6.4
  '@vitest/coverage-v8': ^5.0.3
  astro-eslint-parser: ^3.2.0
  es-toolkit: ^1.52.0
  eslint: ^10.12.0
  eslint-plugin-sonarjs: ^4.2.2
  jiti: ^2.7.0
  svelte: ^5.57.1
  svelte-eslint-parser: ^1.8.1
  tsdown: ^0.23.0
  tsx: ^4.23.15
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vitest: ^5.0.3
  vue-eslint-parser: ^10.4.1

packages:
  - 'packages/*'
# The runner names tests with a space where vitest 5 matches ` > ` (stryker-js#6210, unmerged #6214),
# and reads a suite whose import threw as passing. On a bump, drop what the release carries.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
