name: audit

# Too slow for pull request CI, so it runs on its own clock.
# No mutation cache: an incremental report cannot see files the tests read at runtime, so it can hide a change.

on:
  schedule:
    # Sunday noon UTC: nothing releases at the weekend.
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  eslint-plugin:
    name: eslint-plugin fixers, options and negatives over real code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The fix pass alone takes about 25 minutes on a laptop, and two more passes follow.
    timeout-minutes: 180
    env:
      # ESLint warns once per corpus file carrying `/* eslint-env */`; named rather than `--no-warnings`.
      NODE_OPTIONS: --disable-warning=ESLintEnvWarning
    steps:
      - uses: actions/checkout@v7

      # Third-party actions are pinned to a commit: a tag can be moved.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          # Pinned to the patch: a floating `26` resolved below the declared `>=26.10.0`.
          node-version: 26.10.0
          cache: pnpm

      # The audits import `src/rules/index.ts`, and `node_modules` is the first corpus source.
      - run: pnpm install --frozen-lockfile

      # Not cached: a never-changing key would freeze the corpus.
      - name: Clone the corpus
        shell: bash
        run: |
          # A job-level `env` cannot read the runner context.
          CORPUS="$RUNNER_TEMP/linteljs-real-code"
          echo "CORPUS=$CORPUS" >> "$GITHUB_ENV"
          mkdir -p "$CORPUS"
          # microsoft/TypeScript is absent: 60,000 files of compiler baselines would drown the hand-written code.
          for repo in \
            facebook/react \
            vuejs/core \
            colinhacks/zod \
            TanStack/query \
            mui/material-ui \
            withastro/astro \
            storybookjs/storybook \
            remix-run/react-router \
            date-fns/date-fns \
            axios/axios
          do
            git clone --depth 1 --single-branch --quiet \
              "https://github.com/$repo" "$CORPUS/${repo#*/}"
          done
          du -sh "$CORPUS"

      - name: Prepare the log directory
        run: mkdir -p reports

      # `shell: bash` adds pipefail: without it `tee` reports success and a finding never fails the job.
      - name: Fixers preserve the program
        shell: bash
        run: pnpm --filter @linteljs/eslint-plugin run audit:real "$CORPUS" "$GITHUB_WORKSPACE/node_modules" 2>&1 | tee reports/audit-real.log

      # Every other pass runs at default options, so a fix broken only under an option needs this.
      - name: Fixers preserve the program under every option
        if: ${{ !cancelled() }}
        shell: bash
        run: pnpm --filter @linteljs/eslint-plugin run audit:options "$CORPUS" "$GITHUB_WORKSPACE/node_modules" 2>&1 | tee reports/audit-options.log

      - name: Rules still catch what they claim to
        if: ${{ !cancelled() }}
        shell: bash
        run: pnpm --filter @linteljs/eslint-plugin run audit:negatives "$CORPUS" "$GITHUB_WORKSPACE/node_modules" 2>&1 | tee reports/audit-negatives.log

      # Uploaded on failure too: a finding prints the file and a minimal reproduction.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: eslint-plugin-logs
          path: reports/*.log
          retention-days: 30

  eslint-plugin-mutants:
    name: eslint-plugin mutants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Each part is a quarter of the 75 minutes a whole cold run took.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [rules-a, rules-b, rules-c, rest]
    env:
      STRYKER_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Not `ignoreStatic`: the static mutants are what `ruleModules.test.ts` exists to kill.
      # Each mutant runs the whole suite; at four workers on four cores the slow kills time out.
      - name: Tests still kill the mutants
        shell: bash
        run: pnpm --filter @linteljs/eslint-plugin run mutation --concurrency 2 2>&1 | tee mutation.log

      # Names every mutant not killed, so a timeout is fixable from the run page without the artifact.
      - name: List the mutants not killed
        if: always()
        run: pnpm --filter @linteljs/eslint-plugin run audit:mutants "$GITHUB_WORKSPACE/packages/eslint-plugin/reports/mutation/mutation.json" "eslint-plugin ${{ matrix.part }}"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: eslint-plugin-${{ matrix.part }}-logs
          # The JSON names each timed-out mutant; the text log only counts them.
          path: |
            mutation.log
            packages/eslint-plugin/reports/mutation/mutation.json
          retention-days: 30

  eslint-config:
    name: eslint-config mutants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        part: [layers, frameworks, rest]
    env:
      STRYKER_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Suites import the sibling packages through their built `exports`.
      - run: pnpm build

      # ubuntu-latest has four cores; the config's six is sized for a laptop.
      - name: Tests still kill the mutants
        shell: bash
        run: pnpm --filter @linteljs/eslint-config run mutation --concurrency 3 2>&1 | tee mutation.log

      # Names every mutant not killed, so a timeout is fixable from the run page without the artifact.
      - name: List the mutants not killed
        if: always()
        run: pnpm --filter @linteljs/eslint-plugin run audit:mutants "$GITHUB_WORKSPACE/packages/eslint-config/reports/mutation/mutation.json" "eslint-config ${{ matrix.part }}"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: eslint-config-${{ matrix.part }}-logs
          path: |
            mutation.log
            packages/eslint-config/reports/mutation/mutation.json
          retention-days: 30

  create:
    name: create mutants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Parts are sized in `stryker.config.mjs` to run cold in under two hours.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: [targets-a, targets-b, targets-c, targets-d, targets-e, emitters-a, emitters-b, terminal-answers, config-utils-rings, rest]
    env:
      STRYKER_PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Suites import the sibling packages through their built `exports`.
      - run: pnpm build

      - name: Tests still kill the mutants
        shell: bash
        run: pnpm --filter @linteljs/create run mutation --concurrency 3 2>&1 | tee mutation.log

      # Names every mutant not killed, so a timeout is fixable from the run page without the artifact.
      - name: List the mutants not killed
        if: always()
        run: pnpm --filter @linteljs/eslint-plugin run audit:mutants "$GITHUB_WORKSPACE/packages/create/reports/mutation/mutation.json" "create ${{ matrix.part }}"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: create-${{ matrix.part }}-logs
          path: |
            mutation.log
            packages/create/reports/mutation/mutation.json
          retention-days: 30
