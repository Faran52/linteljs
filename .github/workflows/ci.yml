name: ci

on:
  push:
    branches: [main, 'v*']
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Every starter case, warm or not: too slow for `check`, whose leg then lints only what changed.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/linteljs/typed
          key: typed-${{ hashFiles('packages/create/templates/**', 'packages/create/src/**') }}
          restore-keys: typed-

      - run: pnpm lint:starters --all

      # Build first: the packages typecheck against each other's built declarations.
      - run: pnpm check
        env:
          LINTELJS_GATE_SKIP: test:coverage

      # `oldest-runtime` cannot build for itself: pnpm and the bundler both need a modern Node.
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-dist
          path: packages/eslint-plugin/dist
          retention-days: 1

  test:
    name: tests, shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    strategy:
      # docs/DESIGN.md: Coverage runs in shards in CI
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm test:shard --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: coverage, merged
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: pnpm test:merge

  smoke:
    name: packed artifacts load
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Unit tests cannot catch a broken `exports` map or a missing `files` entry.
      - run: pnpm --filter @linteljs/eslint-plugin smoke
      - run: pnpm --filter @linteljs/eslint-config smoke
      - run: pnpm --filter @linteljs/create smoke

  compat:
    name: rules run on eslint 8.40, 9 and 10
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # `peerDependencies.eslint` is `>=8.40.0`: 8.40 on eslintrc, 9 and 10 on flat, byte-identical fixed output.
      - run: pnpm --filter @linteljs/eslint-plugin compat

  oldest-runtime:
    name: artifact runs on node ${{ matrix.node }} (eslint ${{ matrix.eslint }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # The `engines.node` floor in a container: the bare runtime a consumer on that floor has.
        include:
          - node: 22
            eslint: '8.40.0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: plugin-dist
          path: packages/eslint-plugin/dist

      # The runner imports the root `scripts/`, so tsdown bundles it here. `--ignore-scripts` keeps `prepare` off `dist`.
      - uses: ./.github/actions/setup
        with:
          install-flags: --ignore-scripts
      - name: Build the runner for node 22
        working-directory: packages/eslint-plugin
        run: >-
          pnpm exec tsdown scripts/release/run-rules/runRulesRelease.ts --no-config --no-dts --no-clean
          --format esm --target node22 --platform node --out-dir scripts/release/run-rules

      # From the host, not `container:`: actions/* cannot run on node:22-alpine's musl.
      - name: Run the rules on node ${{ matrix.node }}
        run: |
          docker run --rm -v "$PWD/packages/eslint-plugin:/src:ro" -w /tmp node:${{ matrix.node }}-alpine sh -c '
            set -e
            cp -r /src/dist /src/scripts /tmp/
            npm install --no-audit --no-fund --no-save eslint@${{ matrix.eslint }}
            node scripts/release/run-rules/runRulesRelease.mjs dist/index.js
          '
