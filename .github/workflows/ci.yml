name: ci

on:
  push:
    branches: [main, 'v*']
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: the gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Third-party actions are pinned to a commit: a tag can be moved.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the packages typecheck against each other's built declarations.
      - run: pnpm check

      # `oldest-runtime` cannot build for itself: pnpm and the bundler both need a modern Node.
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-dist
          path: packages/eslint-plugin/dist
          retention-days: 1

  smoke:
    name: packed artifacts load
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Unit tests cannot catch a broken `exports` map or a missing `files` entry.
      - run: pnpm --filter @linteljs/eslint-plugin smoke
      - run: pnpm --filter @linteljs/eslint-config smoke
      - run: pnpm --filter @linteljs/create smoke

  compat:
    name: rules run on eslint 6 to 10
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `peerDependencies.eslint` is `>=6.0.0`: five majors, both config formats, byte-identical fixed output.
      - run: pnpm --filter @linteljs/eslint-plugin compat

  oldest-runtime:
    name: artifact runs on node ${{ matrix.node }} (eslint ${{ matrix.eslint }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # The `engines.node` floor in a container: the bare runtime a consumer on that floor has.
        include:
          - node: 18
            eslint: '6'
          - node: 18
            eslint: '7'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: plugin-dist
          path: packages/eslint-plugin/dist

      # Node 18 strips no types, so tsdown builds the runner on the host. `--ignore-scripts` keeps `prepare` off `dist`.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the runner for node 18
        working-directory: packages/eslint-plugin
        run: >-
          pnpm exec tsdown scripts/release/run-rules/runRulesRelease.ts --no-config --no-dts --no-clean
          --format esm --target node18 --platform node --out-dir scripts/release/run-rules

      # From the host, not `container:`: actions/* on Node 24 cannot run on node:18-alpine's musl.
      - name: Run the rules on node ${{ matrix.node }}
        run: |
          docker run --rm -v "$PWD/packages/eslint-plugin:/src:ro" -w /tmp node:${{ matrix.node }}-alpine sh -c '
            set -e
            cp -r /src/dist /src/scripts /tmp/
            npm install --no-audit --no-fund --no-save eslint@${{ matrix.eslint }}
            node scripts/release/run-rules/runRulesRelease.mjs dist/index.js
          '
