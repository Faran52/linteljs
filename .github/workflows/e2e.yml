name: e2e

# Network installs on every case keep it off pull requests.

on:
  push:
    branches: [main, 'v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    # One manager per runner.
    name: answers pass their own gate (${{ matrix.pm }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Every manager reports: one failing answer must not hide a second on another manager.
      fail-fast: false
      matrix:
        pm: [pnpm, npm, bun, yarn]
    steps:
      - uses: actions/checkout@v7

      # pnpm runs the workspace itself, so every job has it, and the pnpm job tests this one.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm

      # The CLI installs no manager, and the yarn 1 the runner carries fails the run before any case.
      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Node 26 no longer bundles corepack. Installed ahead of time, so no case ever waits on a download.
      - if: matrix.pm == 'yarn'
        run: npm i -g corepack && corepack enable yarn && corepack install -g yarn@4.18.0

      - run: pnpm install --frozen-lockfile

      # Only the registry storage: npm's cacache alone reached 125GB and never evicts.
      # The week in the key is the eviction policy: tarballs are immutable, so the directory only grows.
      - id: week
        run: echo "id=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .e2e-cache/registry
          key: e2e-registry-${{ steps.week.outputs.id }}
          # This week only: a wider prefix would restore and resave last week's, and never rebuild.
          restore-keys: |
            e2e-registry-${{ steps.week.outputs.id }}

      # `E2E_CONCURRENCY` is per runner: ubuntu-latest has four cores, and a case wants more than one.
      - run: pnpm --filter @linteljs/create test:e2e
        env:
          E2E_PM: ${{ matrix.pm }}
          E2E_CONCURRENCY: 2
