name: e2e

# The generation suite: nine targets on all four managers, plus eleven answer shapes on the default
# one, each scaffolded, installed and put through its own `pnpm check`. Fifty-five network installs
# keep it off pull requests.

on:
  push:
    branches: [main, 'v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    # Four shards of the nine files, one runner each. Vitest splits by file, ordered by a hash of the
    # path rather than by duration, so the shards are even in count and uneven in time; the floor is
    # the slowest single file, `react.e2e.test.ts` at around ten minutes. More shards than four buys
    # nothing until that file is split. Each runner is its own machine, so each starts its own
    # registry on its own port with its own storage, and nothing is shared between them.
    name: targets pass their own gate (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Every shard reports: one failing target must not hide a second in another shard.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm

      # Node 24 bundles npm 12, and `npm pack --dry-run --json` returns an object there where
      # npm 11 returned an array. `create-expo-app` cannot read it, so the React Native case dies
      # before writing a file, whichever package manager the case selected: it shells out to npm
      # directly. https://github.com/expo/expo/issues/48091 is open with no released fix.
      #
      # On every shard, not just the one holding that file: the hash decides which shard that is.
      # The version matches `PACKAGE_MANAGER_VERSIONS.npm`, which an npm project writes into its
      # own `engines`; a runner on a lower npm would warn EBADENGINE on every install.
      #
      # Delete this step, and raise that constant, once a create-expo-app carrying the fix ships.
      - run: npm i -g npm@11.19.1
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # The registry's own storage, and nothing else. Every tarball npmjs serves is stored once here
      # and handed to all four package managers, which all speak the registry protocol, so this is
      # one copy where their four caches would be four. Those are deliberately not cached: npm's
      # cacache alone reached 125GB locally, it never evicts, and a manager refetching over loopback
      # is cheap. Verdaccio rewrites `dist.tarball` per request, so a restored storage works on
      # whatever port the shard binds.
      #
      # The week in the key is the eviction policy. A tarball is immutable and is never replaced, so
      # a new version of a dependency is added beside the old one and the directory only grows;
      # rotating weekly rebuilds it from npmjs instead. Metadata is not at stake either way, since
      # verdaccio revalidates a packument after two minutes and a run picks up what was published.
      - id: week
        run: echo "id=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .e2e-cache/shard-${{ matrix.shard }}/registry
          key: e2e-registry-${{ steps.week.outputs.id }}-shard-${{ matrix.shard }}
          # This week only. A prefix reaching further back would restore last week's directory and save
          # it again under this week's key, so it would never rebuild and the rotation would buy
          # nothing. Another shard of the same week is a fair hit: the tarballs are the same bytes.
          restore-keys: |
            e2e-registry-${{ steps.week.outputs.id }}-

      # This is the only suite where the emitted text meets the real layers. Everything else
      # asserts on strings, and a plugin registered twice, a peer nobody installs or a version
      # range that does not resolve all pass a unit test and then break the first project.
      - run: pnpm --filter @linteljs/create test:e2e --shard ${{ matrix.shard }}/4
