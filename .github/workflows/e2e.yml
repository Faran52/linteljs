name: e2e

# The generation suite: nine targets plus eight answer shapes, each scaffolded, installed and put
# through its own `pnpm check`. Seventeen network installs keep it off pull requests.

on:
  push:
    branches: [main, 'v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: every target generates and passes its own gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm

      # Node 24 bundles npm 12, and `npm pack --dry-run --json` returns an object there where
      # npm 11 returned an array. `create-expo-app` cannot read it, so the React Native case dies
      # before writing a file, whichever package manager the case selected: it shells out to npm
      # directly. https://github.com/expo/expo/issues/48091 is open with no released fix.
      #
      # Delete this step once a create-expo-app carrying that fix is published.
      - run: npm i -g npm@11
      - run: npm --version

      - run: pnpm install --frozen-lockfile

      # This is the only suite where the emitted text meets the real layers. Everything else
      # asserts on strings, and a plugin registered twice, a peer nobody installs or a version
      # range that does not resolve all pass a unit test and then break the first project.
      - run: pnpm --filter @linteljs/create test:e2e
