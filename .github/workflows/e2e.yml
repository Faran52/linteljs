name: e2e

# The generation suite: every pair of answers on every target, the package manager among them. 209
# cases, each generated, installed and put through its own `check`. Network installs on every one of
# them keep it off pull requests.

on:
  push:
    branches: [main, 'v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    # Four shards, one runner each, and the split is `matrix.ts`'s stride rather than vitest's own
    # `--shard`. Vitest splits by file, and one file holds every target; a stride over the
    # ordered case list hands every shard an even share of every target, so no shard is the one
    # that drew React Native and Angular. Measured even: 82/82/82/81.
    #
    # Each runner is its own machine, so each starts its own registry on the same fixed port with
    # its own storage, and nothing is shared between them.
    name: answers pass their own gate (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Every shard reports: one failing answer must not hide a second in another shard.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm

      # Every target runs on every manager, so all of them have to be here, and the
      # CLI installs none of them: one below its floor in `MANAGER_FLOORS` is refused with the
      # reason. The harness injects `npm_config_user_agent` from each manager's real `--version`, so
      # what a runner carries is what every generated project records and declares.
      #
      # Both yarns run through corepack at the release `COREPACK_RELEASES` names, so corepack has to be
      # enabled, and which yarn a runner carries globally does not matter.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # Node 26 no longer bundles corepack, so it is installed before it can enable yarn.
      - run: npm i -g corepack && corepack enable
      - run: bun --version && yarn --version

      - run: pnpm install --frozen-lockfile

      # The registry's own storage, and nothing else. Every tarball npmjs serves is stored once here
      # and handed to all four package managers, which all speak the registry protocol, so this is
      # one copy where their four caches would be four. Those are deliberately not cached: npm's
      # cacache alone reached 125GB locally, it never evicts, and a manager refetching over loopback
      # is cheap. Verdaccio rewrites `dist.tarball` per request, and the port is fixed anyway, so a
      # restored storage works whatever restored it.
      #
      # The week in the key is the eviction policy. A tarball is immutable and is never replaced, so
      # a new version of a dependency is added beside the old one and the directory only grows;
      # rotating weekly rebuilds it from npmjs instead. Metadata is not at stake either way, since
      # verdaccio revalidates a packument after two minutes and a run picks up what was published.
      #
      # One key for every shard now, not one per shard: the four hold the same bytes, and the first
      # to finish saves it for the rest of the week.
      - id: week
        run: echo "id=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .e2e-cache/registry
          key: e2e-registry-${{ steps.week.outputs.id }}
          # This week only. A prefix reaching further back would restore last week's directory and save
          # it again under this week's key, so it would never rebuild and the rotation would buy
          # nothing.
          restore-keys: |
            e2e-registry-${{ steps.week.outputs.id }}

      # This is the only suite where the emitted text meets the real layers. Everything else
      # asserts on strings, and a plugin registered twice, a peer nobody installs or a version
      # range that does not resolve all pass a unit test and then break the first project.
      #
      # `E2E_CONCURRENCY` is per runner, not per suite: ubuntu-latest has four cores, and a case is
      # an install and a full `check`, both of which want more than one.
      - run: pnpm --filter @linteljs/create test:e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}
          E2E_SHARDS: 4
          E2E_CONCURRENCY: 2
