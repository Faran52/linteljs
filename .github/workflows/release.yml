name: release

# Publishing needs no NPM_TOKEN. It needs a trusted publisher registered on npmjs.com for each
# package, pointing at this repository and this workflow file. npm cannot register one for a
# package that does not exist yet, so all three go out by hand the first time; after that, each
# gets a trusted publisher on npmjs.com pointing at this repository and this workflow file.
#
# Ported from `Faran52/eslint-plugin-tidy` and widened from one package to three.

# Pushing the branch is the whole release. The branch name carries the version, this workflow waits
# for `ci` and `e2e` to go green on the same commit, runs the release-only gates, publishes, and
# only then writes the tag: a tag here means all three are on npm, rather than an intent to put them
# there. Nothing releases off main, because main is not a `v*` branch.
on:
  push:
    branches:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      # The tag this writes at the end, and the GitHub release on it.
      contents: write
      # The gate below reads other workflows' runs, which is its own scope.
      actions: read
      # Required for both provenance attestations and OIDC trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # The branch name is the version, so `v1.2.0` releases 1.2.0. One place to say it, and the
      # check below refuses the release rather than shipping whatever the files happen to hold.
      - name: Verify every package is at the version the branch names
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in create eslint-config eslint-plugin; do
            PKG="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$VERSION" != "$PKG" ]; then
              echo "Branch $GITHUB_REF_NAME names $VERSION, but packages/$pkg is at $PKG" >&2
              exit 1
            fi
          done

      # Read here rather than after the publish, because a release whose notes turn out to be empty is one nobody can
      # fix afterwards without editing the release by hand. Not all three: one version covers all three packages, and
      # a version whose change lives in one of them says so there and nowhere else.
      - name: Verify a changelog describes this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in eslint-plugin eslint-config create; do
            if grep -qxF "## $VERSION" "packages/$pkg/CHANGELOG.md"; then
              exit 0
            fi
          done
          echo "No packages/*/CHANGELOG.md has a '## $VERSION' section." >&2
          echo "The release notes are written from those sections, so this would publish an empty release." >&2
          exit 1

      # A second push to the same branch would otherwise try to publish a version that is already on
      # npm and fail deep in the publish step, after twenty minutes of gates. The tag written at the
      # end of a successful run is what makes that knowable in one command, here.
      - name: Refuse to release a version that already went out
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME is tagged, so it is already published." >&2
            echo "Bump the three versions and push the next v* branch." >&2
            exit 1
          fi

      # `ci` and `e2e` start from the same push as this workflow, so they are still running when it
      # begins. Waiting is what makes the publish depend on them; reading their conclusions without
      # waiting would pass while both were still in progress, which is the whole failure this avoids.
      # e2e installs eight targets for real and takes around eleven minutes.
      - name: Wait for ci and e2e to pass on this commit
        uses: actions/github-script@v9
        with:
          script: |
            const wanted = ['ci', 'e2e'];
            const deadline = Date.now() + 40 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
                per_page: 100,
              });

              const runs = wanted.map((name) => {
                return data.workflow_runs.find((run) => run.name === name);
              });

              const failed = runs.filter((run) => run?.conclusion && run.conclusion !== 'success');
              if (failed.length > 0) {
                throw new Error(`Not releasing: ${failed.map((r) => `${r.name} ${r.conclusion}`).join(', ')}`);
              }

              if (runs.every((run) => run?.conclusion === 'success')) {
                core.info('ci and e2e are green.');
                return;
              }

              core.info(`waiting: ${runs.map((r, i) => `${wanted[i]}=${r?.status ?? 'not started'}`).join(', ')}`);
              await new Promise((resolve) => setTimeout(resolve, 30_000));
            }

            throw new Error('ci and e2e did not finish within 40 minutes.');

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # No `registry-url` here, deliberately. It makes setup-node write an .npmrc holding
      # `_authToken=${NODE_AUTH_TOKEN}`, and trusted publishing sets no such variable, so every pnpm command below
      # would print `Failed to replace env in config`. The gates need no registry credentials; the publish step
      # writes that file for itself, immediately before it is used.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm --filter @linteljs/eslint-plugin audit:ignores

      # Every major in `peerDependencies`, not the pinned devDependency alone. The support table in
      # the plugin's README is a claim until this runs.
      - run: pnpm --filter @linteljs/eslint-plugin compat

      - run: pnpm --filter @linteljs/eslint-plugin smoke
      - run: pnpm --filter @linteljs/eslint-config smoke
      - run: pnpm --filter @linteljs/create smoke

      # The registry configuration, written here rather than at the top of the job so the gates above run without an
      # .npmrc naming a token that does not exist. Same file, same contents, four steps later.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # No NODE_AUTH_TOKEN. Authentication is npm trusted publishing: pnpm exchanges the workflow's
      # OIDC token for a short-lived registry token, so there is no long-lived secret to steal.
      #
      # The plugin first, then the config that depends on it, then the CLI that writes both names
      # into a generated project. A consumer installing mid-publish gets a resolvable tree at every
      # point in that order.
      - run: pnpm --filter @linteljs/eslint-plugin publish --no-git-checks --provenance --access public
      - run: pnpm --filter @linteljs/eslint-config publish --no-git-checks --provenance --access public
      - run: pnpm --filter @linteljs/create publish --no-git-checks --provenance --access public

      # After the publish, never before: the tag is the record that all three are on npm, which is
      # also what the "already went out" gate above reads on a second push to this branch.
      - name: Tag the released commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$GITHUB_REF_NAME" -m "$GITHUB_REF_NAME"
          git push origin "refs/tags/$GITHUB_REF_NAME"

      # The three changelog sections for this version, in dependency order, which is the order the packages publish in
      # above. Generated notes still follow underneath: they answer "which commits", and these answer "what changed",
      # and the second is the one a consumer arriving from npm came for.
      - name: Compose the release notes from the changelogs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          : > "$RUNNER_TEMP/notes.md"
          for pkg in eslint-plugin eslint-config create; do
            SECTION="$(awk -v heading="## $VERSION" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found
            ' "packages/$pkg/CHANGELOG.md")"
            if [ -n "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
              printf '## @linteljs/%s\n%s\n\n' "$pkg" "$SECTION" >> "$RUNNER_TEMP/notes.md"
            fi
          done

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true

      # The branch has done its job: the tag holds the commit and the release is out, so leaving it
      # behind only accumulates a branch per version that nobody will read.
      #
      # `refs/heads/` spelled out, not the bare name. The tag written above shares that name, and
      # `git push origin --delete v1.2.0` with both present answers `dst refspec matches more than
      # one` and deletes neither, which would fail the run after all three packages were already on
      # npm. The explicit form deletes the branch and leaves the tag, which is the whole point.
      - name: Delete the release branch
        run: git push origin --delete "refs/heads/$GITHUB_REF_NAME"
