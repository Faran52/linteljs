name: setup
description: pnpm, node and the workspace's dependencies.

inputs:
  install-flags:
    description: Extra flags for `pnpm install`.
    default: ''

runs:
  using: composite
  steps:
    # Third-party actions are pinned to a commit: a tag can be moved.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - uses: actions/setup-node@v7
      with:
        node-version: 26.10.0
        cache: pnpm

    - run: pnpm install --frozen-lockfile ${{ inputs.install-flags }}
      shell: bash
