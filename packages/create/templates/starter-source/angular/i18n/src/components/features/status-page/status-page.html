<main class="status">
  <h1 class="status-code">{{ code() }}</h1>
  <p class="status-message" role="alert">{{ translateId(message()) }}</p>
  <div class="status-actions">
    @if (onRetry(); as retry) {
      <app-button (click)="retry()">{{ t('statusRetry') }}</app-button>
    }
    <a class="status-action" [class.status-action-outline]="onRetry()" href="/">{{ t('statusHome') }}</a>
  </div>
</main>
