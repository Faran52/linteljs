<main class="page">
  <h1 class="page-title">{{ t('about') }}</h1>
  <p class="page-lede">{{ t('aboutLede') }}</p>

  <section class="section">
    <h2 class="section-title">{{ t('aboutGate') }}</h2>
    <ul class="rows">
      @for (leg of gate; track leg.command) {
        <li class="row">
          <code class="key">{{ leg.command }}</code>
          <span class="value">{{ leg.runs }}</span>
        </li>
      }
    </ul>
    <p class="note">
      <app-code-text [text]="t('aboutCheck', { command: check })" />
    </p>
  </section>

  <section class="section">
    <h2 class="section-title">{{ t('aboutStandard') }}</h2>
    <dl class="rows">
      @for (entry of standardPaths; track entry.path) {
        <div class="row">
          <dt><code>{{ entry.path }}</code></dt>
          <dd>{{ t(entry.holds) }}</dd>
        </div>
      }
    </dl>
  </section>

  <section class="section">
    <h2 class="section-title">{{ t('aboutCurrent') }}</h2>
    <p class="note">
      <app-code-text [text]="t('aboutSync', { command: sync })" />
    </p>
  </section>
</main>
