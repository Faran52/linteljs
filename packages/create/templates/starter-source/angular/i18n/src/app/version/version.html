<main class="page">
  <h1 class="page-title">{{ t('version') }}</h1>
  <p class="page-lede">{{ t('versionLede') }}</p>

  <section class="section">
    <h2 class="section-title">{{ t('versionStack') }}</h2>
    <dl class="rows">
      @for (entry of stack; track entry.name) {
        <div class="row">
          <dt>{{ entry.name }}</dt>
          <dd>{{ entry.version }}</dd>
        </div>
      }
    </dl>
  </section>

  <section class="section">
    <h2 class="section-title">{{ t('versionAnswers') }}</h2>
    <dl class="rows">
      @for (entry of answers; track entry.label) {
        <div class="row">
          <dt>{{ entry.label }}</dt>
          <dd>{{ entry.value }}</dd>
        </div>
      }
    </dl>
    <p class="note">
      <app-code-text [text]="t('versionRecorded', recorded)" />
    </p>
  </section>
</main>
