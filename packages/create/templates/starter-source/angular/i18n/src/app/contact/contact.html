<main class="page">
  <h1 class="page-title">{{ t('contact') }}</h1>
  <p class="page-lede">{{ t('contactLede') }}</p>

  @if (sent()) {
    <p class="sent" role="status">{{ t('contactSent') }}</p>
  } @else {
    <form novalidate [formGroup]="form" (ngSubmit)="send()">
      <app-text-input
        name="email"
        [label]="t('contactEmail')"
        type="email"
        [value]="form.controls.email.value"
        [error]="errorOf('email')"
        (valueChange)="set('email', $event)"
        (blurred)="blur('email')"
      />
      <app-text-input
        name="message"
        [label]="t('contactMessage')"
        [multiline]="true"
        [value]="form.controls.message.value"
        [error]="errorOf('message')"
        (valueChange)="set('message', $event)"
        (blurred)="blur('message')"
      />
      <app-button type="submit" [disabled]="sending() || !canSend()" [busy]="sending()">{{ t('contactSend') }}</app-button>
    </form>
  }
</main>
