<app-header [name]="name" />
@let status = crash();
@if (status === 'forbidden') {
  <app-status-page [code]="statuses.forbidden.code" [message]="statuses.forbidden.message" />
} @else if (status === 'serverError') {
  <app-status-page [code]="statuses.serverError.code" [message]="statuses.serverError.message" [onRetry]="retry" />
} @else {
  <router-outlet />
}
