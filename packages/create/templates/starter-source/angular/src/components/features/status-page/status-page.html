<main class="status">
  <h1 class="status-code">{{ code() }}</h1>
  <p class="status-message" role="alert">{{ message() }}</p>
  <div class="status-actions">
    @if (onRetry(); as retry) {
      <app-button (click)="retry()">Try again</app-button>
    }
    <a class="status-action" [class.status-action-outline]="onRetry()" href="/">Go home</a>
  </div>
</main>
