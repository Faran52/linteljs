<main class="page">
  <h1 class="page-title">Contact</h1>
  <p class="page-lede">Two fields, validated on blur. Nothing is sent anywhere.</p>

  @if (sent()) {
    <p class="sent" role="status">Thanks. Nothing was sent, this is a starter.</p>
  } @else {
    <form novalidate (submit)="send($event)">
      <app-text-input
        name="email"
        label="Email"
        type="email"
        [value]="state().values.email"
        [error]="errorOf('email')"
        (valueChange)="set('email', $event)"
        (blurred)="blur('email')"
      />
      <app-text-input
        name="message"
        label="Message"
        [multiline]="true"
        [value]="state().values.message"
        [error]="errorOf('message')"
        (valueChange)="set('message', $event)"
        (blurred)="blur('message')"
      />
      <app-button type="submit" [disabled]="!state().canSubmit">Send</app-button>
    </form>
  }
</main>
