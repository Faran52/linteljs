<main class="page">
  <h1 class="page-title">Contact</h1>
  <p class="page-lede">{{ copy.lede }}</p>

  @if (sent()) {
    <p class="sent" role="status">{{ copy.sent }}</p>
  } @else {
    <form novalidate (submit)="send($event)">
      <app-text-input
        name="email"
        label="Email"
        type="email"
        [value]="state().values.email"
        [error]="errorOf('email')"
        (valueChange)="set('email', $event)"
        (blurred)="blur('email')"
      />
      <app-text-input
        name="message"
        label="Message"
        [multiline]="true"
        [value]="state().values.message"
        [error]="errorOf('message')"
        (valueChange)="set('message', $event)"
        (blurred)="blur('message')"
      />
      <app-button type="submit" [disabled]="!canSubmit()" [busy]="state().isSubmitting">Send</app-button>
    </form>
  }
</main>
