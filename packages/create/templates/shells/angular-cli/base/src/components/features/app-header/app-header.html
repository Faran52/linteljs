<header [class]="styles.header.class">
  <p [class]="styles.starterLabel.class">{{ t('starterLabel') }}</p>
  <p [class]="styles.brand.class">{{ name() }}</p>
  <nav [class]="styles.tabs.class" aria-label="Main">
    @for (page of pages; track page.id) {
      <a
        [class]="styles.tab.class"
        [routerLink]="page.path"
        routerLinkActive="tab-current"
        [routerLinkActiveOptions]="{ exact: page.path === '/' }"
        ariaCurrentWhenActive="page"
      >
        {{ translateId(page.id) }}
      </a>
    }
  </nav>
  <app-language-select />
</header>
