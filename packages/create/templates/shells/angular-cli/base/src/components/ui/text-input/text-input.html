<div [class]="styles.field.class">
  <label [class]="styles.label.class" [for]="name()">{{ label() }}</label>
  @if (multiline()) {
    <textarea
      #field
      [class]="styles.textarea(error() !== undefined).class"
      [id]="name()"
      [name]="name()"
      [value]="value()"
      [attr.aria-invalid]="error() !== undefined"
      [attr.aria-describedby]="describedBy()"
      (input)="valueChange.emit(field.value)"
      (blur)="blurred.emit()"
    ></textarea>
  } @else {
    <input
      #field
      [class]="styles.input(error() !== undefined).class"
      [id]="name()"
      [name]="name()"
      [type]="type()"
      [value]="value()"
      [attr.aria-invalid]="error() !== undefined"
      [attr.aria-describedby]="describedBy()"
      (input)="valueChange.emit(field.value)"
      (blur)="blurred.emit()"
    />
  }
  @if (error() !== undefined) {
    <p [class]="styles.error.class" [id]="name() + '-error'">{{ error() }}</p>
  }
</div>
