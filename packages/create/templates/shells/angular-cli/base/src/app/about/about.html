<main [class]="styles.page.class">
  <h1 [class]="styles.pageTitle.class">{{ t('about') }}</h1>
  <p [class]="styles.pageLede.class">{{ t('aboutLede') }}</p>

  <section [class]="styles.section.class">
    <h2 [class]="styles.sectionTitle.class">{{ t('aboutGate') }}</h2>
    <ul [class]="styles.rows.class">
      @for (leg of gate; track leg.command) {
        <li [class]="styles.row.class">
          <code [class]="styles.key.class">{{ leg.command }}</code>
          <span [class]="styles.value.class">{{ leg.runs }}</span>
        </li>
      }
    </ul>
    <p [class]="styles.note.class">
      <app-code-text [text]="t('aboutCheck', { command: check })" />
    </p>
  </section>

  <section [class]="styles.section.class">
    <h2 [class]="styles.sectionTitle.class">{{ t('aboutStandard') }}</h2>
    <dl [class]="styles.rows.class">
      @for (entry of standardPaths; track entry.path) {
        <div [class]="styles.row.class">
          <dt><code>{{ entry.path }}</code></dt>
          <dd>{{ t(entry.holds) }}</dd>
        </div>
      }
    </dl>
  </section>

  <section [class]="styles.section.class">
    <h2 [class]="styles.sectionTitle.class">{{ t('aboutCurrent') }}</h2>
    <p [class]="styles.note.class">
      <app-code-text [text]="t('aboutSync', { command: sync })" />
    </p>
  </section>
</main>
