<main [class]="styles.page.class">
  <h1 [class]="styles.pageTitle.class">{{ t('contact') }}</h1>
  <p [class]="styles.pageLede.class">{{ t('contactLede') }}</p>

  @if (sent()) {
    <p [class]="styles.sent.class" role="status">{{ t('contactSent') }}</p>
  } @else {
    <form novalidate (submit)="send($event)">
      <app-text-input
        name="email"
        [label]="t('contactEmail')"
        type="email"
        [value]="state().values.email"
        [error]="errorOf('email')"
        (valueChange)="set('email', $event)"
        (blurred)="blur('email')"
      />
      <app-text-input
        name="message"
        [label]="t('contactMessage')"
        [multiline]="true"
        [value]="state().values.message"
        [error]="errorOf('message')"
        (valueChange)="set('message', $event)"
        (blurred)="blur('message')"
      />
      <app-button type="submit" [disabled]="!canSubmit()" [busy]="state().isSubmitting">{{ t('contactSend') }}</app-button>
    </form>
  }
</main>
